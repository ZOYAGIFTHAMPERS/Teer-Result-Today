
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Teer Result Today</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
    }

    .container {
      max-width: 550px;
      margin: 50px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      margin-top: 8px;
      cursor: pointer;
    }

    #googleLogin {
      background: #111827;
      color: white;
    }

    #saveResult {
      background: #16a34a;
      color: white;
    }

    #logout {
      background: #dc2626;
      color: white;
    }

    .hidden {
      display: none;
    }

    .status {
      text-align: center;
      margin: 15px 0;
      font-weight: bold;
    }

    label {
      font-weight: bold;
    }

    .user {
      text-align: center;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="card">

    <h1>Admin Panel</h1>

    <div id="loginSection">

      <p style="text-align:center;">
        Admin Login with Google
      </p>

      <button id="googleLogin">
        Login with Google
      </button>

      <div class="status" id="loginStatus"></div>

    </div>


    <div id="adminSection" class="hidden">

      <div class="user">
        Logged in as:
        <strong id="userEmail"></strong>
      </div>

      <label>Date</label>
      <input type="date" id="resultDate">

      <label>First Round</label>
      <input type="text" id="firstRound" placeholder="Enter First Round">

      <label>Second Round</label>
      <input type="text" id="secondRound" placeholder="Enter Second Round">

      <button id="saveResult">
        Save Result
      </button>

      <button id="logout">
        Logout
      </button>

      <div class="status" id="saveStatus"></div>

    </div>

  </div>
</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyDAKQoepCL8rj5bYeb-cA2VY2vJzNhCUsE",
  authDomain: "teer-result-today.firebaseapp.com",
  projectId: "teer-result-today",
  storageBucket: "teer-result-today.firebasestorage.app",
  messagingSenderId: "903009219263",
  appId: "1:903009219263:web:b10f24ed08ad2cc3904c0a",
  measurementId: "G-NL95SM0CJM"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const provider = new GoogleAuthProvider();


document.getElementById("googleLogin").onclick = async () => {

  try {

    await signInWithPopup(auth, provider);

  } catch (error) {

    document.getElementById("loginStatus").textContent =
      "Login failed: " + error.message;

  }

};


onAuthStateChanged(auth, (user) => {

  if (user) {

    document.getElementById("loginSection")
      .classList.add("hidden");

    document.getElementById("adminSection")
      .classList.remove("hidden");

    document.getElementById("userEmail").textContent =
      user.email;

  } else {

    document.getElementById("loginSection")
      .classList.remove("hidden");

    document.getElementById("adminSection")
      .classList.add("hidden");

  }

});


document.getElementById("saveResult").onclick = async () => {

  const date =
    document.getElementById("resultDate").value;

  const firstRound =
    document.getElementById("firstRound").value.trim();

  const secondRound =
    document.getElementById("secondRound").value.trim();


  if (!date || !firstRound || !secondRound) {

    document.getElementById("saveStatus").textContent =
      "Please fill all fields.";

    return;
  }


  try {

    await setDoc(
      doc(db, "results", "latest"),
      {
        date: date,
        firstRound: firstRound,
        secondRound: secondRound,
        updatedAt: new Date().toISOString()
      }
    );

    document.getElementById("saveStatus").textContent =
      "Result saved successfully!";

  } catch (error) {

    document.getElementById("saveStatus").textContent =
      "Save failed: " + error.message;

  }

};


document.getElementById("logout").onclick = async () => {

  await signOut(auth);

};

</script>

</body>
</html>
