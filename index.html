
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teer Result Today - Live Result</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
      opacity: 0.85;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
      text-align: center;
    }

    .date {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .result-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .result {
      background: #f3f4f6;
      border-radius: 12px;
      padding: 20px 10px;
    }

    .result h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .number {
      font-size: 42px;
      font-weight: bold;
    }

    .updated {
      margin-top: 20px;
      color: #666;
      font-size: 14px;
    }

    .loading {
      padding: 20px;
      color: #666;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 13px;
    }

    @media(max-width: 500px) {
      .result-box {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>TEER RESULT TODAY</h1>
  <p>Live Result Website</p>
</header>

<div class="container">
  <div class="card">

    <div class="date" id="resultDate">
      Loading result...
    </div>

    <div class="result-box">

      <div class="result">
        <h2>FIRST ROUND</h2>
        <div class="number" id="firstRound">--</div>
      </div>

      <div class="result">
        <h2>SECOND ROUND</h2>
        <div class="number" id="secondRound">--</div>
      </div>

    </div>

    <div class="updated" id="updated">
      Waiting for latest result...
    </div>

  </div>
</div>

<footer>
  © 2026 Teer Result Today
</footer>


<!-- Firebase -->
<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getFirestore,
    doc,
    onSnapshot
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  // ==========================================
  // PASTE YOUR FIREBASE CONFIG HERE
  // ==========================================

  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.firebasestorage.app",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
  };


  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);


  // Latest result document
  const resultRef = doc(db, "results", "latest");


  onSnapshot(resultRef, (snapshot) => {

    if (!snapshot.exists()) {
      document.getElementById("resultDate").textContent =
        "No result available";

      document.getElementById("firstRound").textContent = "--";
      document.getElementById("secondRound").textContent = "--";

      return;
    }

    const data = snapshot.data();

    document.getElementById("resultDate").textContent =
      data.date || "Today's Result";

    document.getElementById("firstRound").textContent =
      data.firstRound || "--";

    document.getElementById("secondRound").textContent =
      data.secondRound || "--";

    document.getElementById("updated").textContent =
      "Latest result updated live";

  }, (error) => {

    console.error(error);

    document.getElementById("updated").textContent =
      "Unable to load result";

  });

</script>

</body>
</html>
